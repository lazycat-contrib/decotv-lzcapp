application:
  subdomain: decotv
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://decotv:3000/
services:
  decotv:
    #   ghcr.io/decohererk/decotv:v1.1.0
    # upstream: ghcr.io/decohererk/decotv:v1.5.0
    image: registry.lazycat.cloud/czyt/decohererk/decotv:7ad605a55815002b
    environment:
      - USERNAME={{ .U.admin_username }}
      - PASSWORD={{ .U.admin_password }}
      - NEXT_PUBLIC_STORAGE_TYPE=kvrocks
      - KVROCKS_URL=redis://decotv-kvrocks:6666
    depends_on:
      - decotv-kvrocks
  decotv-kvrocks:
    # apache/kvrocks
    # upstream: apache/kvrocks:2.17.0
    image: registry.lazycat.cloud/czyt/apache/kvrocks:20902f1e14ed74c7
    user: root
    binds:
      - /lzcapp/var/data:/var/lib/kvrocks/data
    entrypoint: kvrocks -c /var/lib/kvrocks/kvrocks.conf --dir /var/lib/kvrocks/data --pidfile /var/run/kvrocks/kvrocks.pid --bind 0.0.0.0
